name: Codeberg Chore-Polish & Kata Verification Agent

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  chore-polish:
    name: Verify SWI-Prolog, Python & Polyglot Katas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog python3
      - name: Run Codeberg CI Chore-Polish Agent
        run: ./scripts/codeberg_ci_agent.sh --chore-polish

  release:
    name: Package Verified Kata Archive
    needs: chore-polish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog python3
      - name: Run Release Agent
        run: ./scripts/codeberg_ci_agent.sh --release
